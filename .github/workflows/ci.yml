# CI skeleton — PRD §13 lists this alongside the repo scaffold as a Phase 0
# prerequisite ("Prerequisites: Repo scaffold, CI skeleton").
#
# PRD §10.5 calls CI optional for the MVP, so this is deliberately a skeleton:
# the gates that actually exist today, on the platform Astra ships for. It is
# not yet the OS matrix (NFR-012) or the network-blocked run (NFR-011) — those
# are named in the PRD as later additions, not as MVP blockers.
#
# Scope: this workflow is a GATE, not a distribution channel, and uploads no
# artifacts. Distributable builds belong in release.yml, which attaches the
# installer to a GitHub Release on version tags. See the note on the packaging
# step below for the storage arithmetic behind that split.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / e2e / package
    # Windows only, because Windows is the only platform Astra supports for
    # release today. Widening this to a matrix is a Phase 1 decision.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Drives the real Electron shell, not a browser pointed at a dev server.
      #
      # `npm run test:e2e` bundles before running Playwright, so this step also
      # proves the main, preload and renderer bundles build. A separate
      # `npm run build` here would be a third full Vite build per run (test:e2e
      # and package each build one) for no additional signal.
      #
      # Deliberately BLOCKING. The first CI run is itself the experiment: it
      # answers whether GUI automation is reliable on a hosted runner — the one
      # thing local green runs cannot prove (PRD RISK-005). Decided 2026-10-15:
      # run it once and see, rather than pre-emptively weakening the gate. If it
      # does prove flaky, split it into its own job; do not silently delete it.
      - name: End-to-end tests
        run: npm run test:e2e

      # PRD RISK-005 asks for a packaging smoke test in CI. This produces the
      # unpacked Windows build; it does not run the installer.
      #
      # Deliberately no upload step. `release/win-unpacked` measures 368 MB
      # (compressed: 150.8 MB), and Actions artifact storage on the free plan is
      # 500 MB shared with GitHub Packages — a few runs would exhaust it. GitHub
      # Releases, by contrast, document "no limit on the total size of a
      # release, nor bandwidth usage". Distribution therefore belongs in
      # release.yml; this job stays a gate that costs no storage at all.
      - name: Packaging smoke test
        run: npm run package

  # Runs on Linux: it only needs `npm ci` and `npm audit`, launches no Electron
  # window and exercises no Windows-specific behavior. Faster to schedule and
  # cheaper than a Windows runner, and it leaves Windows minutes for the job
  # that genuinely needs them. Not yet verified on a Linux runner.
  dependency-audit:
    name: dependency audit (SEC-006)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A critical advisory blocks the build outright. Anything below that is
      # reported but does not block: the known set today is the `sprintf-js`
      # chain pulled in by electron-builder, which is build tooling only and
      # ships to nobody — the packaged asar contains no node_modules at all
      # (see `electron-builder.yml`). Tracked as an accepted risk until
      # electron-builder moves off @electron/get < 5.
      - name: Block on critical advisories
        run: npm audit --audit-level=critical

      - name: Report remaining advisories
        continue-on-error: true
        run: npm audit
