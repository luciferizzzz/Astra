# Release — builds the Windows installer and attaches it to a GitHub Release.
#
# This workflow exists because Actions artifacts and GitHub Releases have
# fundamentally different storage rules:
#
#   Actions artifact  ->  500 MB free plan (shared with GitHub Packages),
#                        per-run, temporary. Measured build: 368 MB.
#   GitHub Release    ->  "no limit on the total size of a release, nor
#                        bandwidth usage" (docs.github.com, About releases).
#
# So ci.yml stays a pure gate that costs no storage, and distribution lands
# here. PRD §10.6 asks for "the installer/portable plus a checksum manifest";
# both are attached.
#
# Triggered by a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Note: re-running a job whose release already exists will fail on `gh release
# create`; delete the draft release first.
name: Release

on:
  push:
    tags: ['v*']

# Creating a release writes to the repository.
permissions:
  contents: write

# Never cancel mid-publish: a half-uploaded release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build installer + draft release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate for what actually ships.
      #
      # E2E is not re-run here: `npm run test:e2e` already runs on every push in
      # ci.yml, and a tag is pushed from a commit that passed it.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # `electron-builder --win` emits `release/Astra Setup <version>.exe`.
      - name: Build NSIS installer
        run: npm run make

      # PRD §10.6: "the installer/portable plus a checksum manifest".
      - name: Generate checksum manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter '*.exe'
          $lines = $files | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Set-Content -Path 'release/SHA256SUMS.txt' -Value $lines -Encoding ascii
          Get-Content 'release/SHA256SUMS.txt'

      # Draft, not published, on purpose: the NSIS installer has never been
      # built or installed on this project. Installing it locally is the
      # verification step, and publishing it is a human decision that follows.
      #
      # `gh` is preinstalled on GitHub-hosted runners, so no third-party action
      # is required to publish.
      - name: Create draft release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = (Get-ChildItem release -File -Filter '*.exe').FullName
          $assets += (Get-Item 'release/SHA256SUMS.txt').FullName
          gh release create $env:GITHUB_REF_NAME $assets --draft --generate-notes
