[package]
name = "astra"
version = "0.1.0"
description = "Astra — Desktop Visual Web Designer"
authors = ["Astra"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix makes the lib name unique so it does not conflict with the bin
# name on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "astra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Foundation / synchronization engine (Phase 0) ---
# Resolved on the first `cargo build` once the Rust toolchain is installed.
blake3 = "1"       # content hashing for sync/conflict detection
notify = "8"       # external file-change watching
walkdir = "2"      # project file traversal
thiserror = "2"    # structured error types

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
